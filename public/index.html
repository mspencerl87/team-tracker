<!doctype html>
<!-- SPDX-License-Identifier: AGPL-3.0-only -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Team Tracker</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%235b4fd6'/%3E%3Crect x='3' y='5' width='3' height='3' fill='%23fff'/%3E%3Crect x='7' y='5' width='3' height='3' fill='%2386efac'/%3E%3Crect x='3' y='9' width='3' height='3' fill='%2386efac'/%3E%3Crect x='7' y='9' width='3' height='3' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">Team Tracker</div>
    <nav class="tabs" id="tabs">
      <button data-view="calendar" class="active">Calendar</button>
      <button data-view="hours">Hours</button>
      <button data-view="manage">Manage</button>
    </nav>
    <div class="topbar-right">
      <label class="tz-picker" title="Every time on this page is shown in this zone">
        <span>Your time zone</span>
        <input id="viewerTz" list="tzList" spellcheck="false" autocomplete="off">
      </label>
      <span class="clock" id="clock"></span>
      <button class="btn ghost" id="authBtn" hidden></button>
    </div>
  </header>

  <section class="toolbar" id="toolbar">
    <div class="btn-group">
      <button class="btn" id="todayBtn">Today</button>
      <label class="btn icon" title="Go to date">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.8" d="M4 6h16v14H4zM4 10h16M8 3v4M16 3v4"/></svg>
        <input type="date" id="datePick" class="hidden-date">
      </label>
    </div>
    <div class="search" id="searchWrap">
      <button class="btn icon" id="searchBtn" title="Search people">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="13" cy="11" r="6" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M8.5 15.5 4 20" stroke="currentColor" stroke-width="1.8"/></svg>
      </button>
      <input id="searchInput" placeholder="Search people" hidden>
    </div>
    <div class="seg" id="modeSeg">
      <button data-mode="departments" class="active">Departments</button>
      <button data-mode="groups">Groups</button>
    </div>
    <div class="filter" id="filter">
      <button class="filter-btn" id="filterBtn">
        <span class="chips" id="filterChips"></span>
        <span class="filter-clear" id="filterClear" title="Clear" hidden>&times;</span>
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="m6 9 6 6 6-6" fill="none" stroke="currentColor" stroke-width="2"/></svg>
      </button>
      <div class="popover" id="filterPop" hidden></div>
    </div>
    <div class="spacer"></div>
    <div class="nav-arrows">
      <button class="btn icon" id="prevBtn" title="Earlier">&#8249;</button>
      <button class="btn icon" id="nextBtn" title="Later">&#8250;</button>
    </div>
  </section>

  <main id="view"></main>
  <footer class="legend" id="legend"></footer>
  <div class="tooltip" id="tooltip" hidden></div>
  <datalist id="tzList"></datalist>

  <!-- Time off -->
  <dialog id="offDlg">
    <form method="dialog" class="dlg" id="offForm">
      <h2 id="offTitle">Time off</h2>
      <label>Person <select name="person_id" required></select></label>
      <label>Type <select name="type_id" required></select></label>
      <div class="row2">
        <label>From <input type="date" name="start_date" required></label>
        <label>To <input type="date" name="end_date" required></label>
      </div>
      <label>Duration
        <select name="part">
          <option value="full">Full day(s)</option>
          <option value="am">Morning only</option>
          <option value="pm">Afternoon only</option>
          <option value="hours">Specific hours</option>
        </select>
      </label>
      <div class="row2" id="offHours" hidden>
        <label>Start <input type="time" name="start_time"></label>
        <label>End <input type="time" name="end_time"></label>
      </div>
      <p class="hint" id="offTzHint"></p>
      <label>Status
        <select name="status">
          <option value="approved">Approved</option>
          <option value="pending">Pending</option>
        </select>
      </label>
      <label>Note <input name="note" maxlength="500" placeholder="Optional"></label>
      <p class="error" id="offError"></p>
      <div class="dlg-actions">
        <button type="button" class="btn danger" id="offDelete" hidden>Delete</button>
        <span class="spacer"></span>
        <button type="button" class="btn" data-close>Cancel</button>
        <button type="submit" class="btn primary">Save</button>
      </div>
    </form>
  </dialog>

  <!-- Person -->
  <dialog id="personDlg">
    <form method="dialog" class="dlg wide" id="personForm">
      <h2 id="personTitle">Person</h2>
      <div class="row2">
        <label>Name <input name="name" required maxlength="120"></label>
        <label>Email <input name="email" type="email" maxlength="200" placeholder="Optional"></label>
      </div>
      <div class="row2">
        <label>Department <select name="department_id"></select></label>
        <label>Time zone <input name="timezone" list="tzList" required spellcheck="false" autocomplete="off"></label>
      </div>
      <fieldset>
        <legend>Groups</legend>
        <div class="checks" id="personGroups"></div>
      </fieldset>
      <fieldset>
        <legend>Work hours <span class="muted">(in their own time zone)</span></legend>
        <div class="sched" id="personSched"></div>
        <button type="button" class="link" id="copyMon">Copy Monday to Tue–Fri</button>
      </fieldset>
      <label class="inline"><input type="checkbox" name="active"> Active (shown on the calendar)</label>
      <p class="error" id="personError"></p>
      <div class="dlg-actions">
        <button type="button" class="btn danger" id="personDelete" hidden>Delete</button>
        <span class="spacer"></span>
        <button type="button" class="btn" data-close>Cancel</button>
        <button type="submit" class="btn primary">Save</button>
      </div>
    </form>
  </dialog>

  <!-- Login -->
  <dialog id="loginDlg">
    <form method="dialog" class="dlg" id="loginForm">
      <h2>Admin login</h2>
      <label>Password <input type="password" name="password" required autocomplete="current-password"></label>
      <p class="error" id="loginError"></p>
      <div class="dlg-actions">
        <span class="spacer"></span>
        <button type="button" class="btn" data-close>Cancel</button>
        <button type="submit" class="btn primary">Log in</button>
      </div>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
