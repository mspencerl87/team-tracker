services:
  team-tracker:
    build: .
    image: team-tracker:latest
    container_name: team-tracker
    restart: unless-stopped
    ports:
      - "8080:8080"
    # Settings come from .env next to this file (see .env.example and the
    # README). With none set, anyone who can open the page can edit.
    env_file:
      - path: .env
        required: false
    volumes:
      - team-tracker-data:/data

volumes:
  team-tracker-data:
